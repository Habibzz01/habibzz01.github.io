<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kata Kata Quote</title>
    <link rel="icon" type="image/svg+xml" href="https://files.catbox.moe/kr4vsu.jpeg">
    <meta name="description" content="Testing API QUOTE By Xbibz Official">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ffffff;
            --secondary: #b0b0b0;
            --accent: #7e57c2;
            --background: #000000;
            --surface: #121212;
            --error: #cf6679;
            --success: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .quote-container {
            background: var(--surface);
            border-radius: 16px;
            padding: 50px 40px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .quote-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            color: var(--accent);
            opacity: 0.7;
        }

        .quote-text {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
            font-weight: 400;
            line-height: 1.8;
        }

        .quote-author {
            color: var(--accent);
            font-size: 1.1rem;
            text-align: right;
            font-weight: 500;
            margin-top: 20px;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--surface);
            color: var(--primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: rgba(126, 87, 194, 0.8);
        }

        .loading {
            display: none;
            color: var(--secondary);
            font-style: italic;
            margin: 20px 0;
        }

        .error {
            display: none;
            color: var(--error);
            background: rgba(207, 102, 121, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid var(--error);
        }

        .api-info {
            background: var(--surface);
            border-radius: 12px;
            padding: 25px;
            margin-top: 40px;
            text-align: left;
        }

        .api-info h3 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .api-info p {
            color: var(--secondary);
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .api-key-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--primary);
            padding: 12px 15px;
            border-radius: 8px;
            margin: 10px 0;
            width: 100%;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .api-key-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(126, 87, 194, 0.2);
        }

        .api-key-input::placeholder {
            color: var(--secondary);
        }

        .footer {
            margin-top: 40px;
            color: var(--secondary);
            font-size: 0.9rem;
        }

        .quote-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--secondary);
        }

        .quote-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--secondary);
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 8px;
        }

        .icon-btn:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .success-message {
            color: var(--success);
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
            }
            
            .quote-container {
                padding: 40px 25px;
            }
            
            .quote-text {
                font-size: 1.3rem;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.95rem;
            }
            
            .controls {
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .quote-text {
                font-size: 1.1rem;
            }
            
            .quote-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Kata Kata</h1>
            <p>Quote Created By Xbibz Official</p>
        </div>

        <div class="quote-container">
            <div class="quote-icon">
                <i class="fas fa-quote-left"></i>
            </div>
            <div class="quote-text" id="quoteText">
                Klik tombol di bawah untuk mendapatkan kata kata motivasi
            </div>
            <div class="quote-author" id="quoteAuthor"></div>
            
            <div class="quote-meta">
                <div class="quote-actions">
                    <button class="icon-btn" onclick="copyQuote()" title="Salin Quote">
                        <i class="fas fa-copy"></i>
                    </button>
                    <button class="icon-btn" onclick="shareQuote()" title="Bagikan Quote">
                        <i class="fas fa-share-alt"></i>
                    </button>
                </div>
                <div id="quoteLength"></div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="getRandomQuote()">
                <i class="fas fa-sync-alt"></i> Quote Baru
            </button>
        </div>

        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i> Memuat quote...
        </div>
        <div class="error" id="error"></div>

        <div class="api-info">
            <h3><i class="fas fa-key"></i> Konfigurasi API</h3>
            <p>Masukkan API Key Anda (dapatkan dari <a href="https://katakataquote.netlify.app" target="_blank" style="color: var(--accent);">dashboard</a>)</p>
            <input type="password" class="api-key-input" id="apiKeyInput" placeholder="Masukkan API Key di sini..." />
            <button class="btn" onclick="saveApiKey()">
                <i class="fas fa-save"></i> Simpan API Key
            </button>
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> API Key berhasil disimpan!
            </div>
            <p style="margin-top: 15px; font-size: 0.85rem;">
                <i class="fas fa-info-circle"></i> Free plan: 10 request/hari | Premium: Unlimited
            </p>
        </div>

        <div class="footer">
            <p>© 2023 Kata Kata Motivasi</p>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('katakata_api_key') || '';

        // Save API Key to localStorage
        function saveApiKey() {
            const input = document.getElementById('apiKeyInput');
            const successMessage = document.getElementById('successMessage');
            
            if (input.value.trim()) {
                apiKey = input.value.trim();
                localStorage.setItem('katakata_api_key', apiKey);
                
                // Show success message
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 3000);
            } else {
                showError('Masukkan API Key yang valid!');
            }
        }

        // Show error message
        function showError(message) {
            const error = document.getElementById('error');
            error.textContent = message;
            error.style.display = 'block';
            
            setTimeout(() => {
                error.style.display = 'none';
            }, 5000);
        }

        // Load saved API Key
        window.onload = function() {
            const savedKey = localStorage.getItem('katakata_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                apiKey = savedKey;
            }
        };

        // Get random quote from API
        async function getRandomQuote() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const quoteText = document.getElementById('quoteText');
            const quoteAuthor = document.getElementById('quoteAuthor');
            const quoteLength = document.getElementById('quoteLength');

            // Show loading, hide error
            loading.style.display = 'block';
            error.style.display = 'none';

            if (!apiKey) {
                showError('Silakan masukkan API Key terlebih dahulu!');
                loading.style.display = 'none';
                return;
            }

            try {
                // Using a CORS proxy to avoid CORS issues
                const proxyUrl = 'https://proxy.corsfix.com/?url=';
                const apiUrl = 'https://katakataquote.netlify.app/api/get-quote';
                
                const response = await fetch(proxyUrl + encodeURIComponent(apiUrl), {
                    headers: {
                        'x-api-key': apiKey,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Gagal mengambil quote. Status: ${response.status}`);
                }

                const data = await response.json();
                
                // Display the quote (adjust based on actual API response format)
                if (data.quote || data.kutipan || data.text) {
                    quoteText.textContent = data.quote || data.kutipan || data.text;
                    quoteAuthor.textContent = data.author || data.penulis || '';
                } else if (Array.isArray(data) && data.length > 0) {
                    // If response is an array
                    quoteText.textContent = data[0].quote || data[0].kutipan || data[0].text || JSON.stringify(data[0]);
                    quoteAuthor.textContent = data[0].author || data[0].penulis || '';
                } else {
                    // Fallback: display the raw data
                    quoteText.textContent = JSON.stringify(data, null, 2);
                    quoteAuthor.textContent = '';
                }
                
                // Update quote length
                const textLength = quoteText.textContent.length;
                quoteLength.textContent = `${textLength} karakter`;

            } catch (err) {
                showError(`Error: ${err.message}`);
                quoteText.textContent = 'Gagal memuat quote. Coba lagi nanti.';
                quoteAuthor.textContent = '';
                quoteLength.textContent = '';
            } finally {
                loading.style.display = 'none';
            }
        }

        // Copy quote to clipboard
        function copyQuote() {
            const quoteText = document.getElementById('quoteText').textContent;
            const quoteAuthor = document.getElementById('quoteAuthor').textContent;
            
            const fullQuote = quoteAuthor ? `"${quoteText}" - ${quoteAuthor}` : `"${quoteText}"`;
            
            navigator.clipboard.writeText(fullQuote).then(() => {
                // Show temporary feedback
                const iconBtn = event.target.closest('.icon-btn');
                const originalIcon = iconBtn.innerHTML;
                iconBtn.innerHTML = '<i class="fas fa-check"></i>';
                iconBtn.style.color = 'var(--success)';
                
                setTimeout(() => {
                    iconBtn.innerHTML = originalIcon;
                    iconBtn.style.color = '';
                }, 2000);
            }).catch(() => {
                showError('Gagal menyalin quote. Silakan salin manual.');
            });
        }

        // Share quote
        function shareQuote() {
            const quoteText = document.getElementById('quoteText').textContent;
            const quoteAuthor = document.getElementById('quoteAuthor').textContent;
            
            const fullQuote = quoteAuthor ? `"${quoteText}" - ${quoteAuthor}` : `"${quoteText}"`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Kata Kata Motivasi',
                    text: fullQuote,
                    url: window.location.href
                }).catch(err => {
                    console.log('Error sharing:', err);
                });
            } else {
                // Fallback: copy to clipboard
                copyQuote();
            }
        }

        // Get initial quote when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (apiKey) {
                getRandomQuote();
            }
        });
    </script>
</body>
</html>
