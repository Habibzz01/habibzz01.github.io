<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting... | Live Location Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="redirect-page">
            <div class="redirect-container">
                <div class="redirect-icon">
                    <i class="fas fa-map-marker-alt fa-spin"></i>
                </div>
                <h1>Redirecting to Location...</h1>
                <p>You will be redirected to the map application shortly.</p>
                <div class="redirect-info">
                    <p><strong>Tracker ID:</strong> <span id="tracker-id">-</span></p>
                    <p><strong>Location:</strong> <span id="location">-</span></p>
                    <p><strong>Accuracy:</strong> <span id="accuracy">-</span> meters</p>
                </div>
                <div class="redirect-actions">
                    <button id="redirect-now" class="btn primary"><i class="fas fa-external-link-alt"></i> Open Now</button>
                    <button id="cancel-redirect" class="btn secondary"><i class="fas fa-times"></i> Cancel</button>
                </div>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
    <script src="dbs.js"></script>
    <script src="script.js"></script>
</body>
</html>
